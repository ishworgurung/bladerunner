# Deletes build artifacts older than 2 hours. GitHub's own retention setting
# cannot go below 1 day, so this scheduled job enforces the shorter lifetime.
# (Release assets are separate from artifacts and are NOT touched.)
name: cleanup
on:
  schedule:
    - cron: '17 * * * *'   # hourly; worst case an artifact lives ~3 hours
  workflow_dispatch:
permissions:
  actions: write
jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      MAX_AGE_HOURS: '2'
    steps:
      - name: delete artifacts older than MAX_AGE_HOURS
        run: |
          cutoff=$(date -u -d "$MAX_AGE_HOURS hours ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "Deleting artifacts created before $cutoff"
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.created_at < \"$cutoff\") | .id" |
          while read -r id; do
            echo "delete artifact $id"
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
          done
